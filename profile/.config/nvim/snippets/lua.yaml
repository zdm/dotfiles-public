for-index:
  trigger: for index
  body: |-
    for n = $1, $2, 1 do
        $3
    end
for-pairs:
  trigger: for pairs
  body: |-
    for key, value in pairs( $1 ) do
        $2
    end
function:
  trigger: function
  body: |-
    function $1 ()
        $2
    end
if-else:
  trigger: if
  body: |-
    if $1 then
        $2
    elseif $3 then
        $4
    else
        $5
    end
shebang:
  trigger:
    - "#!"
    - shebang
  body: "#!/usr/bin/env -S lua"
vim.json.decode( $1 ):
  trigger:
    - vim.json.decode
    - json.decode
  body: vim.json.decode( $1 )
vim.json.encode( $1 ):
  trigger:
    - vim.json.encode
    - json.encode
  body: vim.json.encode( $1 )
vim.print( $1 ):
  trigger:
    - vim.print
    - print
  body: vim.print( $1 )
