process.exit():
  prefix: process.exit()
  body: process.exit()
console.log( $1 ):
  prefix: console.log
  body: console.log( $1 )
JSON.stringify:
  prefix: json.stringify( $1 )
  body: JSON.stringify( $1 )
JSON.parse:
  prefix: json.parse( $1 )
  body: JSON.parse( $1 )
for:
  prefix: "for "
  body: |-
    for ( let n = 0; n < 1; n++ ) {
        $1
    }
if-else:
  prefix: "if "
  body: |-
    if ( $1 ) {
        $2
    }
    else if ( $3 ) {
        $4
    }
    else {
        $5
    }
continue:
  prefix: continue
  body: continue;$1
