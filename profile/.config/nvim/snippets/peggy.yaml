console.log( $1 ):
  trigger: console.log
  body: console.log( $1 )
continue:
  trigger: continue
  body: continue;$1
for:
  trigger: for
  body: |-
    for ( let n = 0; n < 1; n++ ) {
        $1
    }
if-else:
  trigger: if
  body: |-
    if ( $1 ) {
        $2
    }
    else if ( $3 ) {
        $4
    }
    else {
        $5
    }
JSON.parse:
  trigger: json.parse( $1 )
  body: JSON.parse( $1 )
JSON.stringify:
  trigger: json.stringify( $1 )
  body: JSON.stringify( $1 )
process.exit():
  trigger: process.exit()
  body: process.exit()
