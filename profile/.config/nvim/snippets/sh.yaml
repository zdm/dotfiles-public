case:
  trigger: case
  body: |-
    case "\$1" in
        $1)
            exit 0$2
            ;;
        *)
            exit 1
            ;;
    esac
echo:
  trigger: echo
  body: echo $1
for:
  trigger: for
  body: |-
    for $1 in $2; do
        $3
    done
function:
  trigger: function
  body: |-
    function $1() {
        $2
    }
if-else:
  trigger: if
  body: |-
    if [[ $1 ]]; then
        $2
    elif [[ $3 ]]; then
        $4
    else
        $6
    fi
shebang:
  trigger:
    - "#!"
    - shebang
  body: |-
    #!/usr/bin/env -S bash

    set -Eeuo pipefail
    trap 'echo "⚠  Error (\$0:\$LINENO, exit code: \$?): \$BASH_COMMAND" >&2' ERR

    $1
