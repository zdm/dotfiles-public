check-spelling: |-
  Check the spelling in {file} and update the source file.
  Do not attempt to execute any commands; only read and write files are allowed.

prune-old-copilot-sessions: |-
  /sessions prune --older-than 1

review-branch: |-
  /review against main Focus on bugs, regressions, security issues, and edge cases. Do not modify files.
